<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Report</title></head>
  <body>
    <h1>Report</h1>
    <p id="status">Preparing…</p>
    <script>
      // The link appears late and its href has a fresh token each visit.
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = '/report.csv' + location.search + '&token=' + Math.random().toString(36).slice(2);
        a.textContent = 'Download CSV';
        document.body.append(a);
        document.getElementById('status').textContent = 'Ready';
      }, 1500);
    </script>
  </body>
</html>
